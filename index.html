<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedo's Orders - Multi-Account</title>

    <!-- Favicon Configuration -->
    <link rel="icon" type="image/png" href="lol.png">

    <style>
        :root {
            --primary: #0076ff;
            --primary-hover: #0056b3;
            --primary-light: #e6f2ff;
            --success: #00b96b;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --danger: #e53e3e;
            --danger-hover: #c53030;
            --admin-color: #8e44ad;
            --control-bg: #f7fafc;
            --modal-overlay: rgba(26, 32, 44, 0.4);
        }

        /* Dark Mode Theme Variables */
        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: #1e293b;
            --success: #10b981;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --admin-color: #a855f7;
            --control-bg: #0f172a;
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 80px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Auth Screen */
        #auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--border);
        }

        .auth-card h2 { margin-top: 0; margin-bottom: 20px; font-size: 22px; }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .auth-input, .auth-select {
            padding: 12px;
            font-size: 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            width: 100%;
            outline: none;
            background: var(--card-bg);
            color: var(--text);
        }

        .auth-input:focus, .auth-select:focus {
            border-color: var(--primary);
        }

        .auth-btn {
            padding: 12px;
            font-size: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 8px;
        }

        .auth-btn:hover { background-color: var(--primary-hover); }

        .toggle-link {
            display: inline-block;
            margin-top: 16px;
            font-size: 14px;
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
        }

        /* Main App Screen */
        #app-screen { display: none; }

        header {
            background-color: var(--card-bg);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--border);
        }

        .header-title-group {
            display: flex;
            flex-direction: column;
        }

        header h1 { margin: 0; font-size: 20px; }

        .user-badge {
            font-size: 12px;
            color: var(--primary);
            font-weight: 700;
            margin-top: 2px;
        }

        .admin-badge {
            font-size: 11px;
            background-color: var(--admin-color);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            display: none;
        }

        .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        .custom-btn, .history-btn, .settings-btn, .logout-btn, .admin-btn, .theme-btn, .regular-btn {
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
        }

        .theme-btn { background-color: var(--control-bg); color: var(--text); border: 1px solid var(--border); }
        .custom-btn { background-color: #718096; color: white; }
        .regular-btn { background-color: #319795; color: white; }
        .history-btn { background-color: var(--primary-light); color: var(--primary); }
        .settings-btn { background-color: var(--control-bg); color: var(--text); border: 1px solid var(--border); }
        .admin-btn { background-color: var(--primary-light); color: var(--admin-color); }
        .logout-btn { background-color: var(--control-bg); color: var(--danger); border: 1px solid var(--border); }

        .container { max-width: 600px; margin: 20px auto; padding: 0 16px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border);
            position: relative;
        }

        .item-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            background-color: var(--control-bg);
        }

        .item-name { font-weight: 600; font-size: 15px; margin-bottom: 12px; }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--control-bg);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .controls button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--card-bg);
            color: var(--text);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .count { font-size: 15px; font-weight: 700; min-width: 20px; }

        .admin-controls {
            display: none;
            gap: 6px;
            margin-top: 10px;
            width: 100%;
        }

        .admin-edit-btn, .admin-delete-btn {
            flex: 1;
            padding: 6px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .admin-edit-btn { background-color: var(--border); color: var(--text); }
        .admin-delete-btn { background-color: #fed7d7; color: var(--danger); }

        .list-item {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border);
        }

        .list-item-left { display: flex; align-items: center; gap: 14px; }

        .list-item img, .custom-placeholder {
            width: 54px;
            height: 54px;
            border-radius: 8px;
            object-fit: cover;
        }

        .custom-placeholder {
            background-color: var(--control-bg);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed var(--border);
        }

        .qty-badge {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
        }

        .circle-checkbox {
            width: 26px;
            height: 26px;
            border: 2px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
        }

        .circle-checkbox.checked {
            background-color: var(--success);
            border-color: var(--success);
        }

        .circle-checkbox.checked::after { content: "✓"; color: white; font-weight: bold; }

        nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 65px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            z-index: 10;
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }

        .nav-btn.active { color: var(--primary); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--modal-overlay);
            z-index: 20;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            max-height: 75vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .close-modal { background: none; border: none; font-size: 24px; color: var(--text); cursor: pointer; }
        .empty-msg { text-align: center; color: var(--text-muted); margin-top: 40px; }
        
        .danger-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
        .danger-btn:hover { background-color: var(--danger-hover); }

        .regular-add-box {
            background: var(--control-bg);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div id="auth-screen">
        <!-- Login Form -->
        <div class="auth-card" id="login-box">
            <h2>Account Login</h2>
            <div class="form-group">
                <label for="login-username-input">Account Name</label>
                <input type="text" id="login-username-input" class="auth-input" placeholder="Enter account name...">
            </div>
            <div class="form-group">
                <label for="login-pass-input">Password</label>
                <input type="password" id="login-pass-input" class="auth-input" placeholder="Enter password...">
            </div>
            <button class="auth-btn" id="login-btn">Log In</button>
            <span class="toggle-link" id="go-to-create">Create New Account</span>
        </div>

        <!-- Create Account Form -->
        <div class="auth-card" id="create-box" style="display: none;">
            <h2>Create Account</h2>
            <div class="form-group">
                <label for="new-username-input">Account Name</label>
                <input type="text" id="new-username-input" class="auth-input" placeholder="e.g. Home, Office, Kitchen">
            </div>
            <div class="form-group">
                <label for="new-pass-input">Set Password</label>
                <input type="password" id="new-pass-input" class="auth-input" placeholder="Create password...">
            </div>
            <button class="auth-btn" id="create-btn">Create & Login</button>
            <span class="toggle-link" id="go-to-login">Back to Login</span>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen">
        <header>
            <div class="header-title-group">
                <h1 id="page-title">Bedo's Orders</h1>
                <div>
                    <span class="user-badge" id="current-user-display">Account: None</span>
                    <span class="admin-badge" id="admin-badge-indicator">ADMIN</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="theme-btn" id="theme-toggle-btn">🌙 Dark</button>
                <button class="regular-btn" id="open-regular-btn">Regular Items</button>
                <button class="custom-btn" id="header-custom-btn">Custom</button>
                <button class="admin-btn" id="admin-action-btn">Admin</button>
                <button class="history-btn" id="open-history-btn">History</button>
                <button class="settings-btn" id="open-settings-btn">Settings</button>
                <button class="logout-btn" id="logout-btn">Exit</button>
            </div>
        </header>

        <div class="container">
            <div id="order-view">
                <div class="grid" id="items-grid"></div>
            </div>

            <div id="list-view" style="display: none;">
                <div id="active-list"></div>
            </div>
        </div>

        <nav>
            <button class="nav-btn active" id="nav-order">1. Order</button>
            <button class="nav-btn" id="nav-list">2. List</button>
        </nav>
    </div>

    <!-- Regular Items Modal -->
    <div id="regular-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Regular Items</h3>
                <button class="close-modal" id="close-regular-btn">&times;</button>
            </div>

            <!-- Admin Section to Add Item to Regular List -->
            <div id="admin-regular-controls" class="regular-add-box" style="display: none;">
                <div class="form-group">
                    <label for="regular-item-select">Add Item from Catalog</label>
                    <select id="regular-item-select" class="auth-select"></select>
                </div>
                <button class="auth-btn" id="add-to-regular-btn" style="margin-top: 0;">Add to Regular List</button>
            </div>

            <div id="regular-items-list"></div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>History (Past 30 Mins)</h3>
                <button class="close-modal" id="close-history-btn">&times;</button>
            </div>
            <div id="history-list"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Account Settings</h3>
                <button class="close-modal" id="close-settings-btn">&times;</button>
            </div>
            <div class="form-group">
                <label for="edit-username-input">Update Account Name</label>
                <input type="text" id="edit-username-input" class="auth-input" placeholder="New account name">
                <button class="auth-btn" id="save-username-btn">Update Name</button>
            </div>
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
            <div class="form-group">
                <label for="edit-password-input">Update Password</label>
                <input type="password" id="edit-password-input" class="auth-input" placeholder="New password">
                <button class="auth-btn" id="save-password-btn">Update Password</button>
            </div>
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
            <button class="danger-btn" id="delete-account-btn">Delete Account</button>
        </div>
    </div>

    <!-- Admin Add/Edit Item Modal -->
    <div id="admin-item-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="admin-modal-title">Add Item to Catalog</h3>
                <button class="close-modal" id="close-admin-item-btn">&times;</button>
            </div>
            <div class="form-group">
                <label for="admin-item-name">Item Name</label>
                <input type="text" id="admin-item-name" class="auth-input" placeholder="e.g. Fresh Milk">
            </div>
            <div class="form-group">
                <label for="admin-item-file">Upload Image File</label>
                <input type="file" id="admin-item-file" accept="image/*" class="auth-input">
            </div>
            <button class="auth-btn" id="save-admin-item-btn">Save Item</button>
        </div>
    </div>

    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const defaultCatalog = [
            { id: 1, name: "Tissues", img: "images (1).jpg" },
            { id: 2, name: "Creme Caramel", img: "images (2).jpg" },
            { id: 3, name: "Cling Film", img: "images (3).jpg" },

            { id: 28, name: "Cheese Chips", img: "18.png" },

            { id: 32, name: "Green Tea", img: "22.png" },

            { id: 40, name: "Chocolate Milk", img: "30.png" },
            { id: 41, name: "Sugar", img: "31.png" }
        ];

        let catalogItems = [];
        let regularItems = [];
        let currentAccountName = null;
        let activeOrders = [];
        let historyOrders = [];
        let isAdmin = false;
        let currentEditingItemId = null;

        // Theme Toggle Manager
        function initTheme() {
            const savedTheme = localStorage.getItem('appTheme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButtonText(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('appTheme', newTheme);
            updateThemeButtonText(newTheme);
        }

        function updateThemeButtonText(theme) {
            const btn = document.getElementById('theme-toggle-btn');
            if (btn) {
                btn.innerText = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
            }
        }

        // Sync Global Catalog from Firebase
        function listenToCatalogChanges() {
            db.collection("globalCatalog").doc("catalogDoc").onSnapshot(doc => {
                if (doc.exists && doc.data().items) {
                    catalogItems = doc.data().items;
                } else {
                    catalogItems = defaultCatalog;
                    db.collection("globalCatalog").doc("catalogDoc").set({ items: defaultCatalog });
                }
                renderGridItems();
                updateRegularDropdown();
            });
        }

        // Sync Regular Items from Firebase
        function listenToRegularItems() {
            db.collection("globalCatalog").doc("regularItemsDoc").onSnapshot(doc => {
                if (doc.exists && doc.data().items) {
                    regularItems = doc.data().items;
                } else {
                    regularItems = [];
                    db.collection("globalCatalog").doc("regularItemsDoc").set({ items: [] });
                }
                renderRegularItems();
            });
        }

        async function saveAccountToFirebase() {
            if (!currentAccountName) return;
            try {
                await db.collection("accounts").doc(currentAccountName).set({
                    activeOrders: activeOrders,
                    historyOrders: historyOrders
                }, { merge: true });
            } catch (err) {
                console.error("Firebase save error: ", err);
            }
        }

        function loadAccountData(accountName, data) {
            currentAccountName = accountName;
            activeOrders = data.activeOrders || [];
            historyOrders = data.historyOrders || [];
            document.getElementById('current-user-display').innerText = `Account: ${accountName}`;
            updateGridCounts();
            renderActiveList();
        }

        function updateQuantity(id, change, itemName, itemImg) {
            let existingItem = activeOrders.find(item => item.id === id && !item.isCustom);

            if (existingItem) {
                existingItem.qty += change;
                if (existingItem.qty <= 0) {
                    activeOrders = activeOrders.filter(item => item !== existingItem);
                }
            } else if (change > 0) {
                activeOrders.push({
                    id: id,
                    name: itemName,
                    img: itemImg,
                    qty: 1,
                    isCustom: false,
                    key: "item_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4)
                });
            }
            saveAccountToFirebase();
            updateGridCounts();
            renderActiveList();
        }

        function addCustomItem() {
            const customName = prompt("Enter custom item name:");
            if (!customName || customName.trim() === "") return;

            const customQtyString = prompt(`How many "${customName}" do you want to add?`, "1");
            const customQty = parseInt(customQtyString, 10);
            if (isNaN(customQty) || customQty <= 0) {
                alert("Please enter a valid quantity number.");
                return;
            }

            activeOrders.push({
                id: "custom_" + Date.now(),
                name: customName.trim(),
                qty: customQty,
                isCustom: true,
                img: "",
                key: "custom_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4)
            });
            saveAccountToFirebase();
            renderActiveList();
        }

        function updateGridCounts() {
            catalogItems.forEach((item) => {
                const countEl = document.getElementById(`count-${item.id}`);
                const match = activeOrders.find(o => o.id === item.id && !o.isCustom);
                if (countEl) countEl.innerText = match ? match.qty : '0';
            });
        }

        function renderGridItems() {
            const grid = document.getElementById('items-grid');
            grid.innerHTML = '';

            catalogItems.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/150/e6f2ff/0076ff?text=${item.id}'">
                    <div class="item-name">${item.name}</div>
                    <div class="controls">
                        <button id="minus-${item.id}">-</button>
                        <span class="count" id="count-${item.id}">0</span>
                        <button id="plus-${item.id}">+</button>
                    </div>
                    <div class="admin-controls" id="admin-controls-${item.id}" style="display: ${isAdmin ? 'flex' : 'none'};">
                        <button class="admin-edit-btn" id="edit-${item.id}">Edit</button>
                        <button class="admin-delete-btn" id="delete-${item.id}">Delete</button>
                    </div>
                `;
                grid.appendChild(card);

                card.querySelector(`#minus-${item.id}`).addEventListener('click', () => updateQuantity(item.id, -1, item.name, item.img));
                card.querySelector(`#plus-${item.id}`).addEventListener('click', () => updateQuantity(item.id, 1, item.name, item.img));

                if (isAdmin) {
                    card.querySelector(`#edit-${item.id}`).addEventListener('click', () => openAdminEditModal(item));
                    card.querySelector(`#delete-${item.id}`).addEventListener('click', () => deleteCatalogItem(item.id));
                }
            });

            updateGridCounts();
        }

        function renderActiveList() {
            const container = document.getElementById('active-list');
            if (!container) return;
            container.innerHTML = '';

            if (activeOrders.length === 0) {
                container.innerHTML = '<div class="empty-msg">No active items in your list.</div>';
                return;
            }

            activeOrders.forEach((item) => {
                const row = document.createElement('div');
                row.className = 'list-item';

                let mediaElement = `<img src="${item.img}" onerror="this.src='https://via.placeholder.com/150/e6f2ff/0076ff?text=${item.id}'">`;
                if (item.isCustom) {
                    mediaElement = `<div class="custom-placeholder">Custom</div>`;
                }

                row.innerHTML = `
                    <div class="list-item-left">
                        ${mediaElement}
                        <div>
                            <strong>${item.name}</strong>
                            <span class="qty-badge">x${item.qty}</span>
                        </div>
                    </div>
                    <div class="circle-checkbox" id="check-${item.key}"></div>
                `;
                container.appendChild(row);

                row.querySelector(`#check-${item.key}`).addEventListener('click', (e) => {
                    e.target.classList.add('checked');
                    setTimeout(() => {
                        activeOrders = activeOrders.filter(i => i.key !== item.key);
                        historyOrders.push({
                            ...item,
                            completedAt: new Date().getTime()
                        });
                        saveAccountToFirebase();
                        updateGridCounts();
                        renderActiveList();
                    }, 400);
                });
            });
        }

        // --- REGULAR ITEMS LIST LOGIC ---
        function updateRegularDropdown() {
            const select = document.getElementById('regular-item-select');
            if (!select) return;
            select.innerHTML = '';
            catalogItems.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.innerText = item.name;
                select.appendChild(opt);
            });
        }

        function renderRegularItems() {
            const container = document.getElementById('regular-items-list');
            if (!container) return;
            container.innerHTML = '';

            if (regularItems.length === 0) {
                container.innerHTML = '<div class="empty-msg">No regular items added yet.</div>';
                return;
            }

            regularItems.forEach((item) => {
                const row = document.createElement('div');
                row.className = 'list-item';

                const deleteBtn = isAdmin ? `<button class="admin-delete-btn" style="max-width: 70px;" id="del-reg-${item.id}">Delete</button>` : '';

                row.innerHTML = `
                    <div class="list-item-left">
                        <img src="${item.img}" onerror="this.src='https://via.placeholder.com/150/e6f2ff/0076ff?text=${item.id}'">
                        <div>
                            <strong>${item.name}</strong>
                        </div>
                    </div>
                    ${deleteBtn}
                `;
                container.appendChild(row);

                if (isAdmin) {
                    const delBtn = row.querySelector(`#del-reg-${item.id}`);
                    if (delBtn) {
                        delBtn.addEventListener('click', () => removeRegularItem(item.id));
                    }
                }
            });
        }

        async function addSelectedToRegular() {
            const select = document.getElementById('regular-item-select');
            const selectedId = parseInt(select.value, 10);
            const foundItem = catalogItems.find(i => i.id === selectedId);

            if (!foundItem) return;

            if (regularItems.some(i => i.id === foundItem.id)) {
                alert("This item is already in the Regular Items list.");
                return;
            }

            regularItems.push({
                id: foundItem.id,
                name: foundItem.name,
                img: foundItem.img
            });

            await db.collection("globalCatalog").doc("regularItemsDoc").set({ items: regularItems });
        }

        async function removeRegularItem(itemId) {
            regularItems = regularItems.filter(i => i.id !== itemId);
            await db.collection("globalCatalog").doc("regularItemsDoc").set({ items: regularItems });
        }

        function openHistory() {
            const now = new Date().getTime();
            const modal = document.getElementById('history-modal');
            const historyList = document.getElementById('history-list');
            modal.style.display = 'flex';
            historyList.innerHTML = '';

            historyOrders = historyOrders.filter(item => ((now - item.completedAt) / 1000 / 60) <= 30);
            saveAccountToFirebase();

            if (historyOrders.length === 0) {
                historyList.innerHTML = '<div class="empty-msg">No history records in the last 30 minutes.</div>';
                return;
            }

            for (let i = historyOrders.length - 1; i >= 0; i--) {
                const item = historyOrders[i];
                const timeString = new Date(item.completedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                let mediaElement = `<img src="${item.img}" onerror="this.src='https://via.placeholder.com/150/e6f2ff/0076ff?text=${item.id}'">`;
                if (item.isCustom) {
                    mediaElement = `<div class="custom-placeholder">Custom</div>`;
                }

                const row = document.createElement('div');
                row.className = 'list-item';
                row.innerHTML = `
                    <div class="list-item-left">
                        ${mediaElement}
                        <div>
                            <strong>${item.name}</strong>
                            <span class="qty-badge" style="background-color: var(--primary-light); color: var(--success);">x${item.qty}</span>
                            <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Checked at: ${timeString}</div>
                        </div>
                    </div>
                    <div class="circle-checkbox checked" style="pointer-events: none;"></div>
                `;
                historyList.appendChild(row);
            }
        }

        // --- ADMIN FUNCTIONS ---
        function toggleAdminMode() {
            if (!isAdmin) {
                const pass = prompt("Enter Admin Password:");
                if (pass === "4687") {
                    isAdmin = true;
                    document.getElementById('admin-badge-indicator').style.display = 'inline-block';
                    document.getElementById('admin-action-btn').innerText = "+ Add Item";
                    document.getElementById('admin-regular-controls').style.display = 'block';
                    renderGridItems();
                    renderRegularItems();
                    alert("Admin mode activated!");
                } else if (pass !== null) {
                    alert("Incorrect Admin Password!");
                }
            } else {
                openAdminAddModal();
            }
        }

        function openAdminAddModal() {
            currentEditingItemId = null;
            document.getElementById('admin-modal-title').innerText = "Add Item to Catalog";
            document.getElementById('admin-item-name').value = '';
            document.getElementById('admin-item-file').value = '';
            document.getElementById('admin-item-modal').style.display = 'flex';
        }

        function openAdminEditModal(item) {
            currentEditingItemId = item.id;
            document.getElementById('admin-modal-title').innerText = "Edit Item";
            document.getElementById('admin-item-name').value = item.name;
            document.getElementById('admin-item-file').value = '';
            document.getElementById('admin-item-modal').style.display = 'flex';
        }

        async function saveAdminItem() {
            const nameInput = document.getElementById('admin-item-name').value.trim();
            const fileInput = document.getElementById('admin-item-file');

            if (!nameInput) {
                alert("Please enter an item name.");
                return;
            }

            let imageSrc = "";

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                imageSrc = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            if (currentEditingItemId) {
                // Edit existing item
                catalogItems = catalogItems.map(item => {
                    if (item.id === currentEditingItemId) {
                        return {
                            ...item,
                            name: nameInput,
                            img: imageSrc !== "" ? imageSrc : item.img
                        };
                    }
                    return item;
                });
            } else {
                // Add new item
                if (imageSrc === "") {
                    alert("Please select an image file.");
                    return;
                }
                const newId = catalogItems.length > 0 ? Math.max(...catalogItems.map(i => typeof i.id === 'number' ? i.id : 0)) + 1 : 1;
                catalogItems.push({
                    id: newId,
                    name: nameInput,
                    img: imageSrc
                });
            }

            await db.collection("globalCatalog").doc("catalogDoc").set({ items: catalogItems });
            document.getElementById('admin-item-modal').style.display = 'none';
            renderGridItems();
        }

        async function deleteCatalogItem(itemId) {
            if (!confirm("Are you sure you want to delete this item from the catalog?")) return;
            catalogItems = catalogItems.filter(item => item.id !== itemId);
            await db.collection("globalCatalog").doc("catalogDoc").set({ items: catalogItems });
            renderGridItems();
        }

        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            listenToCatalogChanges();
            listenToRegularItems();

            // Theme Toggle Action
            document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);

            // Regular Items Actions
            document.getElementById('open-regular-btn').addEventListener('click', () => {
                document.getElementById('regular-modal').style.display = 'flex';
            });
            document.getElementById('close-regular-btn').addEventListener('click', () => {
                document.getElementById('regular-modal').style.display = 'none';
            });
            document.getElementById('add-to-regular-btn').addEventListener('click', addSelectedToRegular);

            // Navigation Toggle
            document.getElementById('go-to-create').addEventListener('click', () => {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('create-box').style.display = 'block';
            });

            document.getElementById('go-to-login').addEventListener('click', () => {
                document.getElementById('create-box').style.display = 'none';
                document.getElementById('login-box').style.display = 'block';
            });

            // Firebase Login handle
            document.getElementById('login-btn').addEventListener('click', async () => {
                const username = document.getElementById('login-username-input').value.trim();
                const passInput = document.getElementById('login-pass-input').value;

                if (!username || !passInput) {
                    alert("Please enter both Account Name and Password.");
                    return;
                }

                try {
                    const doc = await db.collection("accounts").doc(username).get();
                    if (!doc.exists) {
                        alert("Account not found!");
                        return;
                    }

                    const accountData = doc.data();
                    if (accountData.password === passInput) {
                        loadAccountData(username, accountData);
                        document.getElementById('auth-screen').style.display = 'none';
                        document.getElementById('app-screen').style.display = 'block';
                        document.getElementById('login-username-input').value = '';
                        document.getElementById('login-pass-input').value = '';
                    } else {
                        alert("Incorrect password!");
                    }
                } catch (err) {
                    alert("Error logging in: " + err.message);
                }
            });

            // Firebase Account Creation handle
            document.getElementById('create-btn').addEventListener('click', async () => {
                const nameInput = document.getElementById('new-username-input').value.trim();
                const passInput = document.getElementById('new-pass-input').value;

                if (!nameInput || !passInput) {
                    alert("Please fill in both Account Name and Password.");
                    return;
                }

                try {
                    const doc = await db.collection("accounts").doc(nameInput).get();
                    if (doc.exists) {
                        alert("An account with this name already exists.");
                        return;
                    }

                    const newAccData = {
                        password: passInput,
                        activeOrders: [],
                        historyOrders: []
                    };

                    await db.collection("accounts").doc(nameInput).set(newAccData);

                    loadAccountData(nameInput, newAccData);
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'block';
                    
                    document.getElementById('new-username-input').value = '';
                    document.getElementById('new-pass-input').value = '';
                    document.getElementById('create-box').style.display = 'none';
                    document.getElementById('login-box').style.display = 'block';
                } catch (err) {
                    alert("Error creating account: " + err.message);
                }
            });

            // Account Settings Controls
            document.getElementById('save-username-btn').addEventListener('click', async () => {
                const newName = document.getElementById('edit-username-input').value.trim();
                if (!newName || newName === currentAccountName) return;

                try {
                    const checkDoc = await db.collection("accounts").doc(newName).get();
                    if (checkDoc.exists) {
                        alert("An account with this name already exists.");
                        return;
                    }

                    const oldDoc = await db.collection("accounts").doc(currentAccountName).get();
                    const data = oldDoc.data();

                    await db.collection("accounts").doc(newName).set(data);
                    await db.collection("accounts").doc(currentAccountName).delete();

                    currentAccountName = newName;
                    document.getElementById('current-user-display').innerText = `Account: ${newName}`;
                    document.getElementById('edit-username-input').value = '';
                    document.getElementById('settings-modal').style.display = 'none';
                    alert("Account name updated successfully!");
                } catch (err) {
                    alert("Error updating account name: " + err.message);
                }
            });

            document.getElementById('save-password-btn').addEventListener('click', async () => {
                const newPass = document.getElementById('edit-password-input').value;
                if (!newPass) return;

                try {
                    await db.collection("accounts").doc(currentAccountName).update({ password: newPass });
                    document.getElementById('edit-password-input').value = '';
                    document.getElementById('settings-modal').style.display = 'none';
                    alert("Password updated successfully!");
                } catch (err) {
                    alert("Error updating password: " + err.message);
                }
            });

            document.getElementById('delete-account-btn').addEventListener('click', async () => {
                if (!confirm(`Are you sure you want to delete account "${currentAccountName}"? This action cannot be undone.`)) return;

                try {
                    await db.collection("accounts").doc(currentAccountName).delete();
                    currentAccountName = null;
                    document.getElementById('settings-modal').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'none';
                    document.getElementById('auth-screen').style.display = 'flex';
                    alert("Account deleted.");
                } catch (err) {
                    alert("Error deleting account: " + err.message);
                }
            });

            // Admin Actions
            document.getElementById('admin-action-btn').addEventListener('click', toggleAdminMode);
            document.getElementById('save-admin-item-btn').addEventListener('click', saveAdminItem);
            document.getElementById('close-admin-item-btn').addEventListener('click', () => {
                document.getElementById('admin-item-modal').style.display = 'none';
            });

            // Logout handle
            document.getElementById('logout-btn').addEventListener('click', async () => {
                await saveAccountToFirebase();
                currentAccountName = null;
                isAdmin = false;
                document.getElementById('admin-badge-indicator').style.display = 'none';
                document.getElementById('admin-action-btn').innerText = "Admin";
                document.getElementById('admin-regular-controls').style.display = 'none';
                document.getElementById('app-screen').style.display = 'none';
                document.getElementById('auth-screen').style.display = 'flex';
                renderRegularItems();
            });

            // Modals Controls
            document.getElementById('header-custom-btn').addEventListener('click', addCustomItem);
            document.getElementById('open-history-btn').addEventListener('click', openHistory);
            document.getElementById('close-history-btn').addEventListener('click', () => {
                document.getElementById('history-modal').style.display = 'none';
            });

            document.getElementById('open-settings-btn').addEventListener('click', () => {
                document.getElementById('settings-modal').style.display = 'flex';
            });
            document.getElementById('close-settings-btn').addEventListener('click', () => {
                document.getElementById('settings-modal').style.display = 'none';
            });

            // Nav Tabs Switcher
            document.getElementById('nav-order').addEventListener('click', () => {
                document.getElementById('order-view').style.display = 'block';
                document.getElementById('list-view').style.display = 'none';
                document.getElementById('nav-order').classList.add('active');
                document.getElementById('nav-list').classList.remove('active');
                document.getElementById('page-title').innerText = "Order";
                document.getElementById('header-custom-btn').style.display = 'block';
            });

            document.getElementById('nav-list').addEventListener('click', () => {
                document.getElementById('order-view').style.display = 'none';
                document.getElementById('list-view').style.display = 'block';
                document.getElementById('nav-order').classList.remove('active');
                document.getElementById('nav-list').classList.add('active');
                document.getElementById('page-title').innerText = "List";
                document.getElementById('header-custom-btn').style.display = 'none';
                renderActiveList();
            });
        });
    </script>
</body>
</html>
