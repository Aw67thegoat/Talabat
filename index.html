<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order System - Multi-Account</title>
    <style>
        :root {
            --primary: #0076ff;
            --primary-hover: #0056b3;
            --primary-light: #e6f2ff;
            --success: #00b96b;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --danger: #e53e3e;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 80px;
        }

        /* Auth Screen */
        #auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 118, 255, 0.08);
            text-align: center;
            width: 100%;
            max-width: 380px;
        }

        .auth-card h2 { margin-top: 0; margin-bottom: 20px; font-size: 22px; }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .auth-input, .auth-select {
            padding: 12px;
            font-size: 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            width: 100%;
            outline: none;
            background: white;
            color: var(--text);
        }

        .auth-input:focus, .auth-select:focus {
            border-color: var(--primary);
        }

        .auth-btn {
            padding: 12px;
            font-size: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 8px;
        }

        .auth-btn:hover { background-color: var(--primary-hover); }

        .toggle-link {
            display: inline-block;
            margin-top: 16px;
            font-size: 14px;
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
        }

        /* Main App Screen */
        #app-screen { display: none; }

        header {
            background-color: var(--card-bg);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--border);
        }

        .header-title-group {
            display: flex;
            flex-direction: column;
        }

        header h1 { margin: 0; font-size: 20px; }

        .user-badge {
            font-size: 12px;
            color: var(--primary);
            font-weight: 700;
            margin-top: 2px;
        }

        .header-actions { display: flex; gap: 8px; align-items: center; }

        .custom-btn, .history-btn, .logout-btn {
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
        }

        .custom-btn { background-color: #718096; color: white; }
        .history-btn { background-color: var(--primary-light); color: var(--primary); }
        .logout-btn { background-color: #edf2f7; color: var(--danger); }

        .container { max-width: 600px; margin: 20px auto; padding: 0 16px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .item-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            background-color: #f7fafc;
        }

        .item-name { font-weight: 600; font-size: 15px; margin-bottom: 12px; }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #f7fafc;
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .controls button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .count { font-size: 15px; font-weight: 700; min-width: 20px; }

        .list-item {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border);
        }

        .list-item-left { display: flex; align-items: center; gap: 14px; }

        .list-item img, .custom-placeholder {
            width: 54px;
            height: 54px;
            border-radius: 8px;
            object-fit: cover;
        }

        .custom-placeholder {
            background-color: #edf2f7;
            color: #718096;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #cbd5e0;
        }

        .qty-badge {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
        }

        .circle-checkbox {
            width: 26px;
            height: 26px;
            border: 2px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .circle-checkbox.checked {
            background-color: var(--success);
            border-color: var(--success);
        }

        .circle-checkbox.checked::after { content: "✓"; color: white; font-weight: bold; }

        nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 65px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            z-index: 10;
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }

        .nav-btn.active { color: var(--primary); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(26, 32, 44, 0.4);
            z-index: 20;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .close-modal { background: none; border: none; font-size: 24px; cursor: pointer; }
        .empty-msg { text-align: center; color: var(--text-muted); margin-top: 40px; }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div id="auth-screen">
        <!-- Login Form -->
        <div class="auth-card" id="login-box">
            <h2>Select Account</h2>
            <div class="form-group">
                <label for="account-select">Account</label>
                <select id="account-select" class="auth-select"></select>
            </div>
            <div class="form-group">
                <label for="login-pass-input">Password</label>
                <input type="password" id="login-pass-input" class="auth-input" placeholder="Enter password...">
            </div>
            <button class="auth-btn" id="login-btn">Log In</button>
            <span class="toggle-link" id="go-to-create">Create New Account</span>
        </div>

        <!-- Create Account Form -->
        <div class="auth-card" id="create-box" style="display: none;">
            <h2>Create Account</h2>
            <div class="form-group">
                <label for="new-username-input">Account Name</label>
                <input type="text" id="new-username-input" class="auth-input" placeholder="e.g. Home, Office, Kitchen">
            </div>
            <div class="form-group">
                <label for="new-pass-input">Set Password</label>
                <input type="password" id="new-pass-input" class="auth-input" placeholder="Create password...">
            </div>
            <button class="auth-btn" id="create-btn">Create & Login</button>
            <span class="toggle-link" id="go-to-login">Back to Login</span>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen">
        <header>
            <div class="header-title-group">
                <h1 id="page-title">Order</h1>
                <span class="user-badge" id="current-user-display">Account: None</span>
            </div>
            <div class="header-actions">
                <button class="custom-btn" id="header-custom-btn">Custom</button>
                <button class="history-btn" id="open-history-btn">History</button>
                <button class="logout-btn" id="logout-btn">Exit</button>
            </div>
        </header>

        <div class="container">
            <div id="order-view">
                <div class="grid" id="items-grid"></div>
            </div>

            <div id="list-view" style="display: none;">
                <div id="active-list"></div>
            </div>
        </div>

        <nav>
            <button class="nav-btn active" id="nav-order">1. Order</button>
            <button class="nav-btn" id="nav-list">2. List</button>
        </nav>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>History (Past 30 Mins)</h3>
                <button class="close-modal" id="close-history-btn">&times;</button>
            </div>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        const itemsConfig = [
            { name: "Tissues", img: "images (1).jpg" },
            { name: "Creme Caramel", img: "images (2).jpg" },
            { name: "Cling Film", img: "images (3).jpg" },
            { name: "Onions", img: "images (4).jpg" },
            { name: "Potatoes", img: "images (5).jpg" },
            { name: "Molokhia", img: "images (6).jpg" },
            { name: "Mayonnaise", img: "images (7).jpg" },
            { name: "Raw Chicken", img: "images (8).jpg" },
            { name: "Trash Bags", img: "images (9).jpg" },
            { name: "Dishwashing Liquid", img: "shopping.avif" },
            { name: "Milk", img: "1.png" },
            { name: "Eggs", img: "2.png" },
            { name: "Lusine", img: "3.png" },
            { name: "Green Grapes", img: "4.png" },
            { name: "Green Apple", img: "5.png" },
            { name: "Bananas", img: "6.png" },
            { name: "Bread", img: "7.png" },
            { name: "Burger Patties", img: "8.png" },
            { name: "Burger Buns", img: "9.png" },
            { name: "Berry Juice", img: "10.png" },
            { name: "Yogurt", img: "11.png" },
            { name: "Soda", img: "12.png" },
            { name: "Kinza Cola", img: "13.png" },
            { name: "Ketchup", img: "14.png" },
            { name: "Butter", img: "15.png" },
            { name: "Chocolate Biscuits", img: "16.png" },
            { name: "Macaroni and Cheese", img: "17.png" },
            { name: "Cheese Chips", img: "18.png" },
            { name: "Sliced Bread", img: "19.png" },
            { name: "Flour", img: "20.png" },
            { name: "Tea Bags", img: "21.png" },
            { name: "Green Tea", img: "22.png" },
            { name: "Biscuits", img: "23.png" },
            { name: "Popcorn", img: "24.png" },
            { name: "Cooking Cream", img: "25.png" },
            { name: "Fruit Juice", img: "26.png" },
            { name: "Cucumbers", img: "27.png" },
            { name: "Chocolate Pudding", img: "28.png" },
            { name: "Protein Milk", img: "29.png" },
            { name: "Chocolate Milk", img: "30.png" },
            { name: "Sugar", img: "31.png" }
        ];

        let accounts = JSON.parse(localStorage.getItem('appAccounts')) || {
            "Default": { password: "talabat1234", activeOrders: [], historyOrders: [] }
        };

        let currentAccountName = null;
        let activeOrders = [];
        let historyOrders = [];

        function saveAccountsToStorage() {
            if (currentAccountName && accounts[currentAccountName]) {
                accounts[currentAccountName].activeOrders = activeOrders;
                accounts[currentAccountName].historyOrders = historyOrders;
            }
            localStorage.setItem('appAccounts', JSON.stringify(accounts));
        }

        function loadAccountData(accountName) {
            currentAccountName = accountName;
            activeOrders = accounts[accountName].activeOrders || [];
            historyOrders = accounts[accountName].historyOrders || [];
            document.getElementById('current-user-display').innerText = `Account: ${accountName}`;
            updateGridCounts();
            renderActiveList();
        }

        function updateAccountDropdown() {
            const select = document.getElementById('account-select');
            select.innerHTML = '';
            Object.keys(accounts).forEach(accName => {
                const opt = document.createElement('option');
                opt.value = accName;
                opt.innerText = accName;
                select.appendChild(opt);
            });
        }

        function updateQuantity(id, change, itemName, itemImg) {
            let existingItem = activeOrders.find(item => item.id === id && !item.isCustom);

            if (existingItem) {
                existingItem.qty += change;
                if (existingItem.qty <= 0) {
                    activeOrders = activeOrders.filter(item => item !== existingItem);
                }
            } else if (change > 0) {
                activeOrders.push({
                    id: id,
                    name: itemName,
                    img: itemImg,
                    qty: 1,
                    isCustom: false,
                    key: "item_" + Date.now()
                });
            }
            saveAccountsToStorage();
            updateGridCounts();
            renderActiveList();
        }

        function addCustomItem() {
            const customName = prompt("Enter custom item name:");
            if (!customName || customName.trim() === "") return;

            const customQtyString = prompt(`How many "${customName}" do you want to add?`, "1");
            const customQty = parseInt(customQtyString, 10);
            if (isNaN(customQty) || customQty <= 0) {
                alert("Please enter a valid quantity number.");
                return;
            }

            activeOrders.push({
                id: "custom_" + Date.now(),
                name: customName.trim(),
                qty: customQty,
                isCustom: true,
                key: "custom_" + Date.now()
            });
            saveAccountsToStorage();
            renderActiveList();
        }

        function updateGridCounts() {
            itemsConfig.forEach((_, index) => {
                const id = index + 1;
                const countEl = document.getElementById(`count-${id}`);
                const match = activeOrders.find(item => item.id === id && !item.isCustom);
                if (countEl) countEl.innerText = match ? match.qty : '0';
            });
        }

        function renderActiveList() {
            const container = document.getElementById('active-list');
            if (!container) return;
            container.innerHTML = '';

            if (activeOrders.length === 0) {
                container.innerHTML = '<div class="empty-msg">No active items in your list.</div>';
                return;
            }

            activeOrders.forEach((item) => {
                const row = document.createElement('div');
                row.className = 'list-item';

                let mediaElement = `<img src="${item.img}" onerror="this.src='https://via.placeholder.com/150/e6f2ff/0076ff?text=${item.id}'">`;
                if (item.isCustom) {
                    mediaElement = `<div class="custom-placeholder">Custom</div>`;
                }

                row.innerHTML = `
                    <div class="list-item-left">
                        ${mediaElement}
                        <div>
                            <strong>${item.name}</strong>
                            <span class="qty-badge">x${item.qty}</span>
                        </div>
                    </div>
                    <div class="circle-checkbox" id="check-${item.key}"></div>
                `;
                container.appendChild(row);

                row.querySelector(`#check-${item.key}`).addEventListener('click', (e) => {
                    e.target.classList.add('checked');
                    setTimeout(() => {
                        activeOrders = activeOrders.filter(i => i.key !== item.key);
                        if (!item.isCustom) {
                            historyOrders.push({
                                ...item,
                                completedAt: new Date().getTime()
                            });
                        }
                        saveAccountsToStorage();
                        updateGridCounts();
                        renderActiveList();
                    }, 400);
                });
            });
        }

        function openHistory() {
            const now = new Date().getTime();
            const modal = document.getElementById('history-modal');
            const historyList = document.getElementById('history-list');
            modal.style.display = 'flex';
            historyList.innerHTML = '';

            historyOrders = historyOrders.filter(item => ((now - item.completedAt) / 1000 / 60) <= 30);
            saveAccountsToStorage();

            if (historyOrders.length === 0) {
                historyList.innerHTML = '<div class="empty-msg">No history records in the last 30 minutes.</div>';
                return;
            }

            for (let i = historyOrders.length - 1; i >= 0; i--) {
                const item = historyOrders[i];
                const timeString = new Date(item.completedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                const row = document.createElement('div');
                row.className = 'list-item';
                row.innerHTML = `
                    <div class="list-item-left">
                        <img src="${item.img}" onerror="this.src='https://via.placeholder.com/150/e6f2ff/0076ff?text=${item.id}'">
                        <div>
                            <strong>${item.name}</strong>
                            <span class="qty-badge" style="background-color: #e6fcf5; color: var(--success);">x${item.qty}</span>
                            <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Checked at: ${timeString}</div>
                        </div>
                    </div>
                    <div class="circle-checkbox checked" style="pointer-events: none;"></div>
                `;
                historyList.appendChild(row);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById('items-grid');
            itemsConfig.forEach((item, index) => {
                const id = index + 1;
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/150/e6f2ff/0076ff?text=${id}'">
                    <div class="item-name">${item.name}</div>
                    <div class="controls">
                        <button id="minus-${id}">-</button>
                        <span class="count" id="count-${id}">0</span>
                        <button id="plus-${id}">+</button>
                    </div>
                `;
                grid.appendChild(card);

                card.querySelector(`#minus-${id}`).addEventListener('click', () => updateQuantity(id, -1, item.name, item.img));
                card.querySelector(`#plus-${id}`).addEventListener('click', () => updateQuantity(id, 1, item.name, item.img));
            });

            updateAccountDropdown();

            // Toggle screens inside auth
            document.getElementById('go-to-create').addEventListener('click', () => {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('create-box').style.display = 'block';
            });

            document.getElementById('go-to-login').addEventListener('click', () => {
                document.getElementById('create-box').style.display = 'none';
                document.getElementById('login-box').style.display = 'block';
            });

            // Login handle
            document.getElementById('login-btn').addEventListener('click', () => {
                const selectedAcc = document.getElementById('account-select').value;
                const passInput = document.getElementById('login-pass-input').value;

                if (!selectedAcc || !accounts[selectedAcc]) {
                    alert("Please select or create an account.");
                    return;
                }

                if (passInput === accounts[selectedAcc].password) {
                    loadAccountData(selectedAcc);
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'block';
                    document.getElementById('login-pass-input').value = '';
                } else {
                    alert("Incorrect password!");
                }
            });

            // Account Creation handle
            document.getElementById('create-btn').addEventListener('click', () => {
                const nameInput = document.getElementById('new-username-input').value.trim();
                const passInput = document.getElementById('new-pass-input').value;

                if (!nameInput || !passInput) {
                    alert("Please fill in both Account Name and Password.");
                    return;
                }

                if (accounts[nameInput]) {
                    alert("An account with this name already exists.");
                    return;
                }

                accounts[nameInput] = {
                    password: passInput,
                    activeOrders: [],
                    historyOrders: []
                };

                saveAccountsToStorage();
                updateAccountDropdown();
                document.getElementById('account-select').value = nameInput;

                // Auto-login newly created account
                loadAccountData(nameInput);
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                
                document.getElementById('new-username-input').value = '';
                document.getElementById('new-pass-input').value = '';
                document.getElementById('create-box').style.display = 'none';
                document.getElementById('login-box').style.display = 'block';
            });

            // Logout
            document.getElementById('logout-btn').addEventListener('click', () => {
                saveAccountsToStorage();
                currentAccountName = null;
                document.getElementById('app-screen').style.display = 'none';
                document.getElementById('auth-screen').style.display = 'flex';
            });

            document.getElementById('header-custom-btn').addEventListener('click', addCustomItem);
            document.getElementById('open-history-btn').addEventListener('click', openHistory);
            document.getElementById('close-history-btn').addEventListener('click', () => {
                document.getElementById('history-modal').style.display = 'none';
            });

            document.getElementById('nav-order').addEventListener('click', () => {
                document.getElementById('order-view').style.display = 'block';
                document.getElementById('list-view').style.display = 'none';
                document.getElementById('nav-order').classList.add('active');
                document.getElementById('nav-list').classList.remove('active');
                document.getElementById('page-title').innerText = "Order";
                document.getElementById('header-custom-btn').style.display = 'block';
            });

            document.getElementById('nav-list').addEventListener('click', () => {
                document.getElementById('order-view').style.display = 'none';
                document.getElementById('list-view').style.display = 'block';
                document.getElementById('nav-order').classList.remove('active');
                document.getElementById('nav-list').classList.add('active');
                document.getElementById('page-title').innerText = "List";
                document.getElementById('header-custom-btn').style.display = 'none';
                renderActiveList();
            });
        });
    </script>
</body>
</html>
